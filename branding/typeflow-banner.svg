<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo Icon in Banner -->
  <g transform="translate(140, 215) scale(2)">
    <rect width="100" height="100" rx="22" fill="#0f172a"/>
    <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="url(#text-grad)" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M22 32 L36 48 L22 64" fill="none" stroke="url(#text-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 64 C 52 44, 62 72, 74 48" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <rect x="76" y="32" width="6" height="32" rx="3" fill="#c084fc"/>
  </g>

  <!-- Typography -->
  <text x="380" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="800" fill="url(#text-grad)" letter-spacing="-2">TypeFlow</text>
  <text x="385" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Zero-dependency, interruptible typewriter animation engine</text>
  
  <!-- Badge -->
  <rect x="385" y="395" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="418" font-family="monospace" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">v2.2.0 ESM</text>

  <rect x="525" y="395" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="605" y="418" font-family="monospace" font-size="16" font-weight="600" fill="#a855f7" text-anchor="middle">StaticCanvas</text>
</svg>
