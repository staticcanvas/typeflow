<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <linearGradient id="tf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="url(#tf-grad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Terminal Prompt Chevron -->
  <path d="M22 32 L36 48 L22 64" fill="none" stroke="url(#tf-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Animated / Fluid Wave Line -->
  <path d="M44 64 C 52 44, 62 72, 74 48" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <!-- Typewriter Blinking Cursor Block -->
  <rect x="76" y="32" width="6" height="32" rx="3" fill="#c084fc" filter="url(#tf-glow)"/>
</svg>
