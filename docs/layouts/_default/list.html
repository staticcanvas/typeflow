{{ define "main" }}
<div class="doc-page">
  <header class="doc-header">
    {{ with .Params.eyebrow }}<span class="doc-eyebrow">{{ . }}</span>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="doc-lead">{{ . }}</p>{{ end }}
  </header>
  
  <div class="doc-content">
    {{ .Content }}
    
    <div class="card-grid">
      {{ range .Pages }}
      <a class="guide-card" href="{{ .Permalink }}">
        <h3>{{ .Title }}</h3>
        <p>{{ .Description }}</p>
      </a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
