{{ define "main" }}
<article class="doc-page">
  <header class="doc-header">
    {{ with .Params.eyebrow }}<span class="doc-eyebrow">{{ . }}</span>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="doc-lead">{{ . }}</p>{{ end }}
  </header>
  
  <div class="doc-body">
    {{ if and (gt (len .TableOfContents) 0) (not .Params.noToc) }}
    <aside class="doc-toc">
      <div class="toc-title">On this page</div>
      {{ .TableOfContents }}
    </aside>
    {{ end }}
    
    <div class="doc-content">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
