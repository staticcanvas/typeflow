{{- /* Multi-format favicon set. relURL keeps every URL valid under the GitLab Pages /typeflow/ base path. */ -}}
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" sizes="any">
<link rel="icon" type="image/png" href="{{ "favicon-32x32.png" | relURL }}" sizes="32x32">
<link rel="icon" type="image/png" href="{{ "favicon-16x16.png" | relURL }}" sizes="16x16">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}" sizes="180x180">
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
