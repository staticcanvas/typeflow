baseURL = 'https://staticcanvas.gitlab.io/typeflow/'
locale = 'en-AU'
title = 'TypeFlow documentation'
publishDir = '../public'
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term']

[params]
  version = '2.3.0'
  description = 'TypeFlow is a lightweight, interruptible, framework-agnostic typewriter animation library designed for modern web applications and static sites.'
  author = 'StaticCanvas'
  repository = 'https://gitlab.com/staticcanvas/typeflow'
  github = 'https://github.com/staticcanvas/typeflow'
  npm = 'https://www.npmjs.com/package/@staticcanvas/typeflow'
  jsr = 'https://jsr.io/@staticcanvas/typeflow'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = false
    tabWidth = 2

[outputs]
  home = ['HTML', 'JSON', 'Markdown', 'LLMS', 'LLMSFULL']
  page = ['HTML', 'Markdown']
  section = ['HTML', 'Markdown']

[mediaTypes]
  [mediaTypes.'text/markdown']
    suffixes = ['md']

[outputFormats]
  [outputFormats.Markdown]
    mediaType = 'text/markdown'
    baseName = 'index'
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMS]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = 'text/plain'
    baseName = 'llms-full'
    isPlainText = true
    notAlternative = true

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = '../branding'
  target = 'static/assets/branding'

