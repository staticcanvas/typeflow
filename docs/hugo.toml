baseURL = 'https://staticcanvas.gitlab.io/typeflow/'
locale = 'en-AU'
title = 'TypeFlow documentation'
publishDir = '../public'
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term']

[params]
  version = '2.3.0'
  description = 'Lightweight, interruptible typewriter animation library with HTML sanitization, erase modes, and sequence orchestration.'
  repository = 'https://gitlab.com/staticcanvas/typeflow'
  github = 'https://github.com/staticcanvas/typeflow'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = true
    style = 'github-dark'

[outputs]
  home = ['HTML', 'JSON']

[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = '../branding'
  target = 'static/assets/branding'

