# Validation runs for merge requests, main/develop, and supported SemVer tags.
# Publishing runs only for protected *-release tags; Pages also deploys from main.

image: sgkens/phellams-automator:${AUTOMATOR_VERSION}

default:
  tags:
    - docker

variables:
  NODE_VERSION: '25.2.1'
  AUTOMATOR_DEVOPS_REF: 'cec29eddec3c78342c75d7b18360a8da61db158a'
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  NPM_CONFIG_PRODUCTION: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_PREFER_OFFLINE: 'true'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+-release(?:\+[a-zA-Z0-9.-]+)?$/'
    - when: never

.release_on_semver_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+-release(?:\+[a-zA-Z0-9.-]+)?$/'
      when: on_success
    - when: never

stages:
  - lint
  - test
  - build
  - validate
  - coverage
  - deploy
  - release
  - notify
# ------------------------------------------------------
# Lint stage
# ------------------------------------------------------
lint:
  stage: lint
  needs: []
  script:
    - echo "🔍 Linting code..."
    - npm ci
    - npm run lint
  allow_failure: false

# ------------------------------------------------------
# Test stage
# ------------------------------------------------------
test:
  stage: test
  needs: []
  script:
    - echo "🔵 Running tests..."
    - npm ci
    - npm test
  allow_failure: false

# ------------------------------------------------------
# Coverage stage
# ------------------------------------------------------
coverage:
  stage: coverage
  extends: .release_on_semver_tag
  needs: [test]
  script:
    - echo "🟣 Collecting test coverage..."
    - npm ci
    - npm run test:coverage
    - command -v codecov
    - codecov --verbose upload-process --disable-search --fail-on-error -t "$CODECOV_API_KEY" -n "typeflow-${CI_COMMIT_SHORT_SHA}" -F unit -f coverage/lcov.info
  allow_failure: false

# ------------------------------------------------------
# Build stage
# ------------------------------------------------------
build:
  stage: build
  needs: []
  before_script:
    - echo "🔵 Preparing build..."
    - command -v jq >/dev/null 2>&1 && command -v zip >/dev/null 2>&1 || (apt-get update && apt-get install -y jq zip)
  script:
    - echo "🟢 Building package..."
    - VERSION=$(jq -r .version package.json)
    - PROJECT_NAME=$(jq -r .name package.json)
    - |
      if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
        echo "package.json contains an invalid SemVer version: $VERSION"
        exit 1
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Tag $CI_COMMIT_TAG triggered the pipeline; package.json version $VERSION is the release source of truth."
      fi
    - echo "PROJECT_VERSION=$VERSION" >> build.env
    - echo "PROJECT_NAME=$PROJECT_NAME" >> build.env
    - npm ci
    - npm run build
    - npm run check:size
    - mkdir -p "dist/${CI_PROJECT_NAME}/dist"
    - tar -czf "/tmp/${CI_PROJECT_NAME}-${VERSION}.tar.gz" -C "dist/${CI_PROJECT_NAME}" dist
    - (cd "dist/${CI_PROJECT_NAME}" && zip -qr "/tmp/${CI_PROJECT_NAME}-${VERSION}.zip" dist)
    - mv "/tmp/${CI_PROJECT_NAME}-${VERSION}.tar.gz" "/tmp/${CI_PROJECT_NAME}-${VERSION}.zip" "dist/${CI_PROJECT_NAME}/dist/"
    - echo "✅ Build complete!"
    - ls -lah dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
    reports:
      dotenv: build.env
  allow_failure: false

# ------------------------------------------------------
# Release artifact and documentation validation
# ------------------------------------------------------
validate:release:
  stage: validate
  needs:
    - job: lint
      artifacts: false
    - job: build
      artifacts: true
  script:
    - npm ci
    - npm run validate:release -- "dist/${CI_PROJECT_NAME}"
    - |
      pwsh -NoProfile -Command '
        $files = @("tools/Get-ReleaseDownloads.ps1", "tools/Request-GenericPackage.ps1")
        foreach ($file in $files) {
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "PowerShell syntax validation failed for $file" }
        }
      '
    - hugo --source docs --gc --minify
  allow_failure: false

# ------------------------------------------------------
# Deploy to Generic Package Registry
# ------------------------------------------------------
deploy:generic:
  extends: .release_on_semver_tag
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: validate:release
      artifacts: false
  resource_group: generic-registry
  before_script:
    - echo "🔵 Preparing Generic Registry upload..."
    - cd dist/${CI_PROJECT_NAME}/dist
  script:
    - echo "🟢 Uploading artifacts for version ${PROJECT_VERSION}..."
    # Define the list of files to upload
    - FILES=$(find . -maxdepth 1 -type f -print)
    - |
      for FILE in $FILES; do
        FILENAME=$(basename "$FILE")
        echo "🔵 Uploading '$FILENAME' to Generic Gilab package registry...\n"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$FILE" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${PROJECT_VERSION}/${FILENAME}"
        echo "\n ✅ Uploaded '$FILENAME'\n"
      done
    - echo "✅ All artifacts uploaded to Generic Registry \n"
  environment:
    name: Generic
    url: https://gitlab.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/-/packages/generic/${CI_PROJECT_NAME}/${PROJECT_VERSION}

# ------------------------------------------------------
# Auto-deploy on version tags (v1.0.0, 1.0.0, etc.)
# > to bypass npm 2FA for automated releases
# > use https://docs.npmjs.com/trusted-publishers
# ------------------------------------------------------
deploy:npm:auto:
  extends: .release_on_semver_tag
  stage: deploy
  tags: []
  needs:
    - job: build
      artifacts: true
    - job: validate:release
      artifacts: false
  resource_group: npm-registry
  id_tokens:
    NPM_ID_TOKEN:
      aud: 'npm:registry.npmjs.org'
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - cd dist/${CI_PROJECT_NAME}

    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")

    - |
      echo "🔎 Checking registry for ${PACKAGE_NAME}@${PACKAGE_VERSION}..."

      if [[ $(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null) ]]; then
        echo "🛑 Version ${PACKAGE_VERSION} is already published to npm. Skipping."
        exit 0
      else
        echo "🟢 Version ${PACKAGE_VERSION} is new. Publishing..."
      fi
  script:
    - echo "🟢 Auto-publishing to npm..."
    - npm install -g npm@latest
    - npm publish --access public
    - echo "✅ Published to npm!"
  environment:
    name: npm
    url: https://www.npmjs.com/package/${CI_PROJECT_NAME}

# ------------------------------------------------------
# Publish to JSR (JavaScript Registry) for supply chain security
# As Per: https://jsr.dev/docs/publishing/
# ------------------------------------------------------
publish:jsr:auto:
  extends: .release_on_semver_tag
  stage: deploy
  tags: []
  needs:
    - job: build
      artifacts: true
    - job: validate:release
      artifacts: false
  resource_group: jsr-registry
  before_script:
    - cd dist/${CI_PROJECT_NAME}

    - PACKAGE_NAME=$(node -p "require('./package.json').name")
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")

    - echo "🔎 Checking registry for ${PACKAGE_NAME}@${PACKAGE_VERSION}..."

    - |
      if npx jsr view "${PACKAGE_NAME}@${PACKAGE_VERSION}" >/dev/null 2>&1; then
        echo "🛑 JSR package already exists. Skipping publish."
        exit 0
      else
        echo "🟢 JSR package does not exist. Proceeding with publish."
      fi
  script:
    # npx jsr publish automatically detects the token above
    - echo "🟢 Auto-publishing to JSR..."
    - npx jsr publish --token ${JSR_API_KEY} --allow-dirty
  environment:
    name: JSR
    url: https://jsr.io/${PACKAGE_NAME}/v/${PACKAGE_VERSION}

generate:generic:release:metadata:
  extends: .release_on_semver_tag
  stage: release
  resource_group: generic-registry
  needs:
    - job: deploy:generic
      artifacts: false
    - job: build
      artifacts: true
    - job: deploy:npm:auto
      artifacts: false
    - job: publish:jsr:auto
      artifacts: false

  before_script:
    - echo "🔵 Preparing release notes generation..."
    # pull in automator scripts
    - git clone https://gitlab.com/phellams/automator-devops.git
    - git -C automator-devops checkout --detach "$AUTOMATOR_DEVOPS_REF"
    # fetch full git history for accurate release notes
    - git fetch --tags --prune --unshallow || git fetch --tags --prune
  script:
    # ---------------------------------------------------------
    # STEP 1: Create the PowerShell Script
    # We write the content to 'generate_meta.ps1' first.
    # We use 'EOF' (quoted) to prevent Bash from trying to expand variables.
    # This allows PowerShell to handle the variables instead.
    # ---------------------------------------------------------
    - |
      cat <<'EOF' > generate_meta.ps1

      # Import Modules
      using module ./automator-devops/scripts/core/Request-GenericPackage.psm1
      using module ./automator-devops/scripts/core/Get-RemoteFileHash.psm1
      using module ./automator-devops/scripts/core/Get-ReleaseNotes.psm1

      Write-Host "🟢 Generating Generic Package Registry download links for version $env:PROJECT_VERSION..."

      # 1. Fetch Links (Use Splatting for readability)
      $params = @{
          ProjectId      = $env:CI_PROJECT_ID
          PackageName    = $env:CI_PROJECT_NAME
          ProjectName    = $env:CI_PROJECT_NAME
          Namespace      = $env:CI_PROJECT_NAMESPACE
          PackageVersion = $env:PROJECT_VERSION
          ApiKey         = $env:CI_JOB_TOKEN
          ApiUrl         = $env:CI_API_V4_URL
          ci             = $true
      }
      $links = Request-GenericPackage @params

      # 🔍 DEBUG: Print the count to the logs so we know if it worked
      Write-Host "🔹 Found $($links.Count) matching files."

      # 2. Define the extensions you want to capture
      $suffixes = @(
          '.esm.js', '.esm.js.map',
          '.esm.min.js', '.esm.min.js.map',
          '.js', '.min.js',
          '.js.map', '.min.js.map'
      )

      # 3. Filter and Select (Loop logic)
      $all_links = $suffixes | ForEach-Object {
          $targetFile = "$env:CI_PROJECT_NAME$_"

          # Find the file, sort by newest, take the first one
          $links | Where-Object { $_.file_name -eq $targetFile } |
                  Sort-Object created_at -Descending |
                  Select-Object -First 1
      }

      # Archives include the release version in their filename.
      $all_links += @($links | Where-Object {
          $_.file_name -like "$env:CI_PROJECT_NAME-*.zip" -or
          $_.file_name -like "$env:CI_PROJECT_NAME-*.tar.gz"
      })

      # Optional diagnostics are published alongside the core browser builds.
      $all_links += @($links | Where-Object {
          $_.file_name -like "$env:CI_PROJECT_NAME-metrics*" -or
          $_.file_name -like "$env:CI_PROJECT_NAME-debug*"
      })

      # 🔍 DEBUG: Print the count to the logs so we know if it worked
      Write-Host "🔹 Found $($all_links.Count) matching files."

      # 4. Export JSON
      $OutputDir = "dist/$env:CI_PROJECT_NAME"
      New-Item -ItemType Directory -Force -Path $OutputDir | Out-Null

      if ($all_links.Count -gt 0) {
        $all_links | ConvertTo-Json -Depth 5 | Out-File -FilePath "$OutputDir/generic-package-links.json"

        # Create Checksums
        $all_links | Select-Object file_name, checksum | ConvertTo-Json -Depth 2 | Out-File -FilePath "$OutputDir/generic-package-checksums.json"

        Write-Host "✅ JSON files generated successfully."
      } else {
        Write-Error "❌ No matching files found! The JSON will be empty."
        exit 1
      }

      Write-Host "✅ Generic Package Registry download links generated at $OutputDir/generic-package-links.json"

      # Create Checksums
      Write-Host "🟢 Generic Package Checksums"
      $all_links | Select-Object file_name, checksum | ConvertTo-Json -Depth 2 | Out-File -FilePath "dist/$ENV:CI_PROJECT_NAME/generic-package-checksums.json" -Encoding utf8
      Write-Host "✅ Generic Package Registry checksums generated at $OutputDir/generic-package-checksums.json"

      # Generate Release Notes
      Write-Host "🟢 Generating release notes..."
      $Release_notes = Get-ReleaseNotes -AheadOnly -FeatureNotes -BreakingChanges -FeatureAdditions -Notes -FeatureUpdates -CommitLink -CommitLinkPrefix gitlab -NameSpace $env:CI_PROJECT_NAMESPACE
      if (-not [string]::IsNullOrWhiteSpace($Release_notes)) {
        $Release_notes | Out-File -FilePath "$OutputDir/release-notes.md" -Encoding utf8
        Write-Host "✅ Release notes generated at $OutputDir/release-notes.md"
      } elseif (Test-Path "release-notes.md") {
        Copy-Item -Path "release-notes.md" -Destination "$OutputDir/release-notes.md" -Force
        Write-Host "✅ Copied root release-notes.md to $OutputDir/release-notes.md"
      } else {
        Write-Host "⚠️ No release notes generated and no root release-notes.md found."
      }

      EOF

    # ---------------------------------------------------------
    # STEP 2: Execute the Script
    # ---------------------------------------------------------
    - pwsh ./generate_meta.ps1

    # ---------------------------------------------------------
    # STEP 3: Upload (Bash)
    # ---------------------------------------------------------
    - |
      echo "🟢 Uploading metadata to Generic Registry..."

      # Safety check: Ensure directory exists
      cd "dist/${CI_PROJECT_NAME}" || { echo "❌ Directory not found"; exit 1; }

      # Define the files you want to upload
      FILES="generic-package-checksums.json generic-package-links.json"

      for FILE in $FILES; do
        if [ -f "$FILE" ]; then
          echo "🔹 Uploading $FILE..."

          curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$FILE" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${PROJECT_VERSION}/${FILE}"
        else
          echo "⚠️ Warning: '$FILE' not found in $(pwd), skipping."
        fi
      done

      echo "✅ Upload complete."

  artifacts:
    paths:
      # Use wildcard if you aren't 100% sure of the project name casing,
      # otherwise ensure this matches the $OutputDir created above.
      - dist/*/generic-package-links.json
      - dist/*/generic-package-checksums.json
      - dist/*/release-notes.md

# ------------------------------------------------------
# Create GitLab release
# As Per: https://docs.gitlab.com/user/project/releases/release_cli/
#   - Release-cli has been deprecated, use gitlab-cli instead
# ------------------------------------------------------
release:gitlab:
  extends: .release_on_semver_tag
  stage: release
  resource_group: gitlab-release
  needs:
    - job: deploy:generic
      artifacts: false
    - job: build
      artifacts: true
    - job: deploy:npm:auto
      artifacts: false
    - job: publish:jsr:auto
      artifacts: false
    - job: generate:generic:release:metadata
      artifacts: true
  script:
    - |
      echo "🟢 Preparing Release Data..."

      # 0. Read repository backfill and generated release notes.
      RELEASE_NOTES=$(cat "dist/${CI_PROJECT_NAME}/release-notes.md" 2>/dev/null || cat release-notes.md 2>/dev/null || echo "No release notes found.")

      # 1. Initialize an empty string for our asset flags
      ASSET_LINKS=$(jq -c '[.[] | {name: .file_name, url: .download_url, link_type: "package"}]' "dist/${CI_PROJECT_NAME}/generic-package-links.json")

      echo "🟢 Creating GitLab release for version ${PROJECT_VERSION}..."

      # 3. Create the description string
      # IMPORTANT: EOF must NOT be quoted so that variables like ${PROJECT_VERSION} expand.
      DESCRIPTION=$(cat <<EOF

      ${RELEASE_NOTES}

      ## **Package Links**

      ### ▪️ NPM Registry
      * https://www.npmjs.com/package/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/v/${PROJECT_VERSION}

      ### ▪️ JSR (JavaScript Registry)
      * https://www.jsr.io/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/v/${PROJECT_VERSION}

      ### ▪️ Unpkg CDN
      * ***ESM***: \`https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.esm.js\`
      * ***UMD***: \`https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.js\`
      - ***ESM Minified***: \`https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.esm.min.js\`
      - ***UMD Minified***: \`https://unpkg.com/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.min.js\`

      ### ▪️ jsDelivr CDN
      - ***ESM***: \`https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.esm.js\`
      - ***UMD***: \`https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.js\`
      - ***ESM Minified***: \`https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.esm.min.js\`
      - ***UMD Minified***: \`https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.min.js\`

      ## Usage

      ### UMD (Browser)
      UMD will auto-load \`${CI_PROJECT_NAME}\` into the global scope \`window.*\`

      \`\`\`html
      <script src="https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.js"></script>
      \`\`\`

      ### ESM (Module)
      ESM can be imported into your JavaScript/TypeScript projects as follows:

      \`\`\`javascript
      import * as packageModule from 'https://cdn.jsdelivr.net/npm/@${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}@${PROJECT_VERSION}/dist/${CI_PROJECT_NAME}.esm.js';
      \`\`\`
      EOF
      )

      PAYLOAD=$(jq -n \
        --arg name "Release ${PROJECT_NAME} ${PROJECT_VERSION}" \
        --arg tag_name "$CI_COMMIT_TAG" \
        --arg description "$DESCRIPTION" \
        --argjson assets "{\"links\": $ASSET_LINKS}" \
        '{name: $name, tag_name: $tag_name, description: $description, assets: $assets}')

      AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      if [ -n "$GITLAB_API_KEY" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_API_KEY}"
      elif [ -n "$GITLAB_TOKEN" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      fi

      ENCODED_TAG=$(printf %s "$CI_COMMIT_TAG" | jq -sRr @uri)
      HTTP_STATUS=$(curl -s -o /tmp/release_response.json -w "%{http_code}" \
        --request POST \
        --header "$AUTH_HEADER" \
        --header "Content-Type: application/json" \
        --data "$PAYLOAD" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")

      if [ "$HTTP_STATUS" -eq 409 ]; then
        echo "ℹ️ Release already exists for $CI_COMMIT_TAG. Updating release..."
        curl --fail-with-body \
          --request PUT \
          --header "$AUTH_HEADER" \
          --header "Content-Type: application/json" \
          --data "$PAYLOAD" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${ENCODED_TAG}"
      elif [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
        echo "✅ GitLab release created successfully."
        cat /tmp/release_response.json
      else
        echo "❌ GitLab release creation failed with HTTP $HTTP_STATUS:"
        cat /tmp/release_response.json
        exit 1
      fi

# ------------------------------------------------------
# GitLab Pages documentation deployment
# Deploys after a production release or a merge to protected branch main.
# ------------------------------------------------------
pages:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
      needs:
        - job: build
          artifacts: true
        - job: validate:release
          artifacts: false
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+-release(?:\+[a-zA-Z0-9.-]+)?$/'
      when: on_success
      needs:
        - job: release:gitlab
          artifacts: false
    - when: never
  script:
    - echo "📚 Building Hugo documentation..."
    - npm ci
    - pwsh ./tools/Get-ReleaseDownloads.ps1 -ProjectId "$CI_PROJECT_ID" -PackageName "$CI_PROJECT_NAME" -ProjectName "$CI_PROJECT_NAME" -Namespace "$CI_PROJECT_NAMESPACE" -ApiUrl "$CI_API_V4_URL" -ApiToken "$CI_JOB_TOKEN" -OutputPath docs/data/releases.json
    - mkdir -p docs/static/data
    - cp docs/data/releases.json docs/static/data/releases.json
    - npm run docs:build
  artifacts:
    paths:
      - public
    expire_in: 1 week
  pages: true
  allow_failure: false

generate-runtime-badge:
  stage: notify
  rules:
    - when: always
  tags:
    - docker
  script:
    - chmod +x ./tools/Calculate-Runtime.ps1 ./tools/Generate-Badge.ps1
    - |
      pwsh -NoProfile -Command '
        $runtime = & ./tools/Calculate-Runtime.ps1

        ./tools/Generate-Badge.ps1 `
          -Label "runtime" `
          -Message $runtime `
          -Style "flat" `
          -IncludeIcon `
          -LabelColor "#555" `
          -MessageColor "#007acc" `
          -OutputPath "runtime-badge-flat.svg"

        ./tools/Generate-Badge.ps1 `
          -Label "runtime" `
          -Message $runtime `
          -Style "for-the-badge" `
          -IncludeIcon `
          -LabelColor "#555" `
          -MessageColor "#007acc" `
          -OutputPath "runtime-badge-for-the-badge.svg"
      '
  artifacts:
    paths:
      - runtime-badge-flat.svg
      - runtime-badge-for-the-badge.svg
    expire_in: never
